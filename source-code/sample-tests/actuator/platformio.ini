; LBCC Robotics Floater — ESP32-P4 firmware
; Requires pioarduino fork (stock espressif32 platform has no P4 support)

[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
